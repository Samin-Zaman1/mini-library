<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Library</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --primary: #1d4ed8;
        --header: #1e3a8a;
        --ok-bg: #dcfce7; --ok-text: #166534;
        --warn-bg: #fef3c7; --warn-text: #92400e;
        --bad-bg: #fee2e2; --bad-text: #991b1b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      header { background: var(--header); color: #fff; padding: 16px 24px; }
      header h1 { margin: 0; font-size: 1.4rem; }
      header p { margin: 4px 0 0; color: #dbeafe; }
      main { max-width: 860px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
      section { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      h2 { margin-top: 0; font-size: 1.1rem; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; max-width: 320px; padding: 10px; border: 1px solid #94a3b8; border-radius: 8px; font-size: 1rem; }
      .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; }
      .book { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; display: grid; gap: 8px; }
      .book h3 { margin: 0; font-size: 1rem; }
      .badge { display: inline-block; width: fit-content; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
      .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
      .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
      .badge.bad { background: var(--bad-bg); color: var(--bad-text); }
      button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-size: .95rem; font-weight: 600; background: var(--primary); color: #fff; }
      button.secondary { background: #e2e8f0; color: var(--text); }
      button:disabled { background: #cbd5e1; color: #334155; cursor: not-allowed; }
      #message { min-height: 1.5em; font-weight: 600; margin: 0; }
      #message.error { color: var(--bad-text); }
      #message.success { color: var(--ok-text); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
      th { color: var(--muted); font-size: .85rem; }
      .empty { color: var(--muted); }
      footer { text-align: center; color: var(--muted); padding: 16px; }
    </style>
  </head>
  <body>
       <header>
      <h1>Mini Library</h1>
      <p>Borrow and return books</p>
      <p id="user-bar">
        Signed in as <strong id="current-user"></strong>
        <button type="button" id="signout" class="secondary">Sign out</button>
      </p>
    </header>

    <main>
      <section aria-labelledby="who-heading">
        <h2 id="who-heading">Who is borrowing?</h2>
        <label for="member">Member name</label>
        <input id="member" type="text" autocomplete="off" />
      </section>

      <p id="message" role="status"></p>

      <section aria-labelledby="books-heading">
        <h2 id="books-heading">Books</h2>
        <ul id="books" class="books"></ul>
      </section>

      <section aria-labelledby="loans-heading">
        <h2 id="loans-heading">Current loans</h2>
        <p id="no-loans" class="empty">No active loans.</p>
        <table id="loans-table" hidden>
          <thead>
            <tr><th>Member</th><th>Book</th><th>Action</th></tr>
          </thead>
          <tbody id="loans"></tbody>
        </table>
      </section>
    </main>

    <footer>Mini Library practice app</footer>

    <script>
              const session = JSON.parse(localStorage.getItem("session") || "null");
      if (!session) {
        window.location.href = "/login.html";
      }
      const books = [
        { id: 1, title: "Clean Code", copies: 2 },
        { id: 2, title: "Refactoring", copies: 1 },
        { id: 3, title: "The Pragmatic Programmer", copies: 0 },
      ];
      const loans = [];
      let nextLoanId = 1;

      const $ = (id) => document.getElementById(id);

      function say(text, kind) {
        const m = $("message");
        m.textContent = text;
        m.className = kind || "";
      }

      function badge(copies) {
        if (copies === 0) return '<span class="badge bad">Out of stock</span>';
        if (copies === 1) return '<span class="badge warn">1 copy left</span>';
        return '<span class="badge ok">' + copies + " copies available</span>";
      }
        if (session) {
        $("current-user").textContent = session.username;
      }
      $("signout").addEventListener("click", () => {
        localStorage.removeItem("session");
        window.location.href = "/login.html";
      });
      function render() {
        $("books").innerHTML = books.map((b) =>
          '<li class="book"><h3>' + b.title + "</h3>" + badge(b.copies) +
          '<button type="button" data-borrow="' + b.id + '" aria-label="Borrow ' + b.title + '"' +
          (b.copies === 0 ? " disabled" : "") + ">Borrow</button></li>"
        ).join("");

        $("loans").innerHTML = loans.map((l) =>
          "<tr><td>" + l.member + "</td><td>" + l.title + "</td><td>" +
          '<button type="button" class="secondary" data-return="' + l.id +
          '" aria-label="Return ' + l.title + " borrowed by " + l.member + '">Return</button></td></tr>'
        ).join("");

        $("no-loans").hidden = loans.length > 0;
        $("loans-table").hidden = loans.length === 0;
      }

      document.addEventListener("click", (e) => {
        const borrowId = e.target.dataset && e.target.dataset.borrow;
        const returnId = e.target.dataset && e.target.dataset.return;

        if (borrowId) {
          const member = $("member").value.trim();
          const book = books.find((b) => b.id === Number(borrowId));
          if (!member) return say("Please enter your name", "error");
          if (book.copies < 1) return say("No copies available", "error");
          book.copies -= 1;
          loans.push({ id: nextLoanId++, member, bookId: book.id, title: book.title });
          render();
          say(member + " borrowed " + book.title, "success");
        }

        if (returnId) {
          const i = loans.findIndex((l) => l.id === Number(returnId));
          const loan = loans[i];
          books.find((b) => b.id === loan.bookId).copies += 1;
          loans.splice(i, 1);
          render();
          say(loan.title + " returned", "success");
        }
      });

      render();
    </script>
  </body>
</html>
